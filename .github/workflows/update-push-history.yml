name: Update README File History

on:
  push:
    branches:
      - main
    paths:
      - "Programs/**"

permissions:
  contents: write

concurrency:
  group: update-readme-file-history
  cancel-in-progress: false

jobs:
  update_readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update file rows
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          def git(*arguments):
              return subprocess.run(
                  ["git", *arguments],
                  check=True,
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
              ).stdout

          readme = Path(os.environ.get("README_PATH", "README.md"))
          text = readme.read_text(encoding="utf-8")
          before = os.environ["BEFORE_SHA"]
          after = os.environ["AFTER_SHA"]
          heading = "## File Push History"
          table_header = "| Program File | Last Push Date | Commit |"
          table_separator = "| :--- | :--- | :--- |"
          lines = text.splitlines()
          heading_index = lines.index(heading)
          table_start = lines.index(table_header, heading_index)
          table_end = len(lines)
          entries = {}

          for index in range(table_start + 2, len(lines)):
              if not lines[index].startswith("|"):
                  table_end = index
                  break

              cells = [cell.strip() for cell in lines[index].strip("|").split("|")]
              if len(cells) == 3 and cells[0].startswith("`"):
                  path = cells[0].strip("`")
                  entries[path] = (cells[1], cells[2].strip("`"))

          if not before or set(before) == {"0"}:
              changed_files = git(
                  "ls-tree", "-r", "--name-only", after, "--", "Programs"
              ).splitlines()
          else:
              changed_files = git(
                  "diff",
                  "--name-only",
                  "--diff-filter=ACDMR",
                  before,
                  after,
                  "--",
                  "Programs",
              ).splitlines()

          for path in changed_files:
              exists = subprocess.run(
                  ["git", "cat-file", "-e", f"{after}:{path}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0

              if not exists:
                  entries.pop(path, None)
                  continue

              metadata = git(
                  "log", "-1", "--format=%cs%x09%h", after, "--", path
              ).strip()
              if not metadata:
                  raise SystemExit(f"Git history not found for {path}")

              date, short_sha = metadata.split("\t", 1)
              entries[path] = (date, short_sha)

          ordered_paths = sorted(entries, key=lambda path: path.lower())
          ordered_paths.sort(key=lambda path: entries[path][0], reverse=True)
          table = [table_header, table_separator]

          for path in ordered_paths:
              date, short_sha = entries[path]
              table.append(f"| `{path}` | {date} | `{short_sha}` |")

          lines[table_start:table_end] = table
          readme.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            echo "README file history is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README file history"
          git push origin HEAD:main
